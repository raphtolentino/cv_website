<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartas Românticas</title>
  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Google Fonts para um toque romântico -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lora', serif;
    }
    h1, h2 {
      font-family: 'Great Vibes', cursive;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-pink-100 to-purple-100">
  <div class="container mx-auto p-6">
    <!-- Page Title -->
    <h1 class="text-5xl font-bold mb-6 text-center text-pink-800">Cartas Românticas</h1>
    
    <!-- Section for Displaying Letters -->
    <div class="max-w-lg mx-auto mb-6">
      <h2 class="text-3xl font-bold text-pink-800 mb-4">Cartas Publicadas</h2>
      <ul id="letterList" class="space-y-4">
        <!-- As cartas serão inseridas aqui -->
      </ul>
    </div>
    
    <!-- Upload Form Section -->
    <form id="letterForm" class="max-w-lg mx-auto bg-pink-50 p-6 rounded shadow-lg border border-pink-200">
      <div class="mb-4">
        <label for="letterDate" class="block text-pink-700 font-medium mb-2">Data da Carta</label>
        <input type="date" id="letterDate" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-pink-300">
      </div>
      <div class="mb-4">
        <label for="letterText" class="block text-pink-700 font-medium mb-2">Conteúdo da Carta</label>
        <textarea id="letterText" rows="4" placeholder="Escreva sua carta de amor..." class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-pink-300"></textarea>
      </div>
      <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-2 rounded">
        Enviar Carta
      </button>
    </form>
  </div>

  <script>
    // Load letters from localStorage or initialize an empty array
    let letters = JSON.parse(localStorage.getItem("letters")) || [];

    const letterList = document.getElementById("letterList");

    // Function to render the list of letters
    function renderLetters() {
      letterList.innerHTML = "";
      // Optionally, sort letters by date (oldest first)
      letters.sort((a, b) => new Date(a.date) - new Date(b.date));
      letters.forEach(letter => {
        const li = document.createElement("li");
        li.className = "bg-white p-4 rounded shadow border border-pink-100";
        const formattedDate = new Date(letter.date).toLocaleDateString("pt-BR");
        li.innerHTML = `
          <div class="text-sm text-pink-600">${formattedDate}</div>
          <div class="mt-2 text-gray-800">${letter.text}</div>
        `;
        letterList.appendChild(li);
      });
    }

    // Initial render on page load
    renderLetters();

    // Handle form submission to add a new letter
    document.getElementById("letterForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const date = document.getElementById("letterDate").value;
      const text = document.getElementById("letterText").value.trim();

      if (!date || !text) {
        alert("Por favor, preencha a data e o conteúdo da carta.");
        return;
      }

      // Add the new letter to the array and update localStorage
      letters.push({ date, text });
      localStorage.setItem("letters", JSON.stringify(letters));

      // Re-render the letters list and clear the form inputs
      renderLetters();
      document.getElementById("letterDate").value = "";
      document.getElementById("letterText").value = "";
    });
  </script>
</body>
</html>
